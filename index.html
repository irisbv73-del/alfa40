<!DOCTYPE html>
<html lang="ro"><head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Saturn 34 - Gestiune Completă</title>
<style>
    @media print {
        @page { size: A4 landscape; margin: 1mm; }
        body { zoom: 60%; -webkit-print-color-adjust: exact !important; }
        .no-print, #lockBtn, .calc-master, .nav-tabs { display: none !important; }
    }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; margin: 0; padding: 5px; color: #000; overflow-x: hidden; }

    /* Header */
    .header-panel {
        display: grid; grid-template-columns: 280px 1fr 200px 45px; gap: 8px;
        background: #FFEBEB; padding: 5px; border: 1px solid #ccc; border-top: 4px solid #d32f2f;
        margin-bottom: 5px; border-radius: 0 0 8px 8px; align-items: center;
    }
    .edit-titlu { font-size: 30px; font-weight: 900; color: #333; border: none; background: transparent; width: 100%; text-align: center; text-transform: uppercase; }

    /* Nav */
    .nav-tabs { display: flex; justify-content: center; margin-bottom: 5px; gap: 5px; }
    .tab-btn { padding: 4px 20px; cursor: pointer; border: 1px solid transparent; font-weight: 700; font-size: 15px; text-transform: uppercase; border-radius: 3px; color: #fff; }
    .btn-a { background: #1b5e20; } .btn-a.active-a { background: #2e7d32; border-color: #000; }
    .btn-b { background: #0d47a1; } .btn-b.active-b { background: #1565c0; border-color: #000; }

    /* Tabel */
    .container { background: #fff; border: 1px solid #000; overflow-x: auto; }
    table { border-collapse: collapse; font-size: 11px; width: 1450px; table-layout: fixed; margin-left: auto; margin-right: auto; }
    th { border: 1px solid #fff; padding: 4px 0; font-weight: 900; color: white; line-height: 1; overflow: hidden; text-transform: uppercase; }
    td { border: 1px solid #999; text-align: center; padding: 6px 0; font-weight: 700; color: #000; }

    /* FIX: font-weight fara px, border cu punct nu virgula */
    .col-ap { font-weight: 600; border-right: 1px solid #999; }

    /* Selectie Rand */
    tr.active-row td { background-color: #ffff00 !important; outline: 1px solid #000; }

    /* Zebra */
    .scara-a-mode tbody tr:nth-child(even):not(.active-row) { background-color: #a5d6a7 !important; }
    .scara-b-mode tbody tr:nth-child(even):not(.active-row) { background-color: #90caf9 !important; }
    .scara-a-th th { background: #1b5e20; }
    .scara-b-th th { background: #0d47a1; }

    .res-col { background-color: #ffcdd2 !important; color: #000 !important; font-weight: 700; border-left: 1px solid #000; border-right: 1px solid #000; }
    .fond-col { background-color: #e1f5fe !important; }

    input[type="number"] { width: 95%; border: none; text-align: center; font-weight: 700; padding: 1px; font-size: 11px; background: transparent; }
    .readonly-mode input { pointer-events: none; }

    .calc-master { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 2px; background: #FFE5E5; padding: 3px; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 4px; }
    .calc-group label { font-size: 9px; font-weight: 700; display: block; text-align: center; }
    /* FIX: font-weight max 900 */
    .calc-group input { width: 65px; text-align: center; font-weight: 900; border: 1px solid #999; background: #fffde7; font-size: 13px; margin: 0 auto; display: block; }
    #lockBtn { background: #d32f2f; color: white; padding: 2px 5px; border: none; border-radius: 2px; font-weight: 700; cursor: pointer; font-size: 11px; }

    /* Bara export/import */
    .export-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 4px;
        padding: 4px 8px; margin-bottom: 5px; }
    .export-bar span { font-weight: 700; font-size: 11px; color: #1b5e20; margin-right: 4px; }
    .btn-exp { padding: 4px 10px; border: none; border-radius: 3px; font-weight: 700; font-size: 12px; cursor: pointer; color: #fff; }
    .btn-json-exp  { background: #1565c0; }
    .btn-json-imp  { background: #6a1b9a; }
    .btn-html-save { background: #e65100; }
    .btn-exp:hover { opacity: 0.85; }
</style>
</head>
<body id="mainBody" class="">

<div class="header-panel">
    <div class="logo-wrap" style="display:flex; align-items:center; gap:25px;">
        <svg style="width:55px;height:55px;fill:#d32f2f;" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
        <div>
            <div id="ceas" style="font-size:30px; font-weight: 600;">22:08:06</div>
            <div style="font-size: 25px;">LUNA: <input type="text" id="l_an" value="MAI 2026" style="width: 100px; font-weight:900; color:#d32f2f; border:none; background:transparent;"></div>
        </div>
    </div>
    <input type="text" id="titlu" class="edit-titlu" value="GESTIUNE SATURN 34">
    <div style="text-align:right; font-weight: 600; line-height: 1;">
        <div style="color: #0d47a1; font-size: 16px;"> PERS: <span id="tot_p">26</span></div>
        <button id="lockBtn" onclick="verificareParola()">🔓 ADMIN</button>
    </div>
</div>

<div class="calc-master no-print">
    <div class="calc-group"><label>Pierderi Apă</label><input type="number" id="f_dif" value="396.39" oninput="recalc()"></div>
    <div class="calc-group"><label>Lumină</label><input type="number" id="f_el" value="40.82" oninput="recalc()"></div>
    <div class="calc-group"><label>Salarii</label><input type="number" id="f_sal" value="490.56" oninput="recalc()"></div>
    <div class="calc-group"><label>Curățenie</label><input type="number" id="f_crt" value="200.01" oninput="recalc()"></div>
    <div class="calc-group"><label>Cheltuieli Sediu</label><input type="number" id="f_sed" value="22.04" oninput="recalc()"></div>
    <div class="calc-group"><label>Com.Bancă</label><input type="number" id="f_bank" value="15.00" oninput="recalc()"></div>
    <div class="calc-group"><label>Chirie</label><input type="number" id="f_chir" value="10.00" oninput="recalc()"></div>
    <div class="calc-group"><label>Gunoi/P</label><input type="number" id="f_gun" value="30.29" oninput="recalc()"></div>
</div>

<div class="nav-tabs no-print">
    <button id="btnA" class="tab-btn btn-a active-a" onclick="switchS('A')">Scara A</button>
    <button id="btnB" class="tab-btn btn-b" onclick="switchS('B')">Scara B</button>
</div>

<div class="export-bar no-print">
    <span>💾 DATE:</span>
    <button class="btn-exp btn-json-exp" onclick="exportJSON()" title="" style="opacity: 1; cursor: pointer;">📤 Exportă JSON</button>
    <button class="btn-exp btn-json-imp" onclick="document.getElementById('importFile').click()" title="" style="opacity: 1; cursor: pointer;">📥 Importă JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    <button class="btn-exp btn-html-save" onclick="salveazaHTML()" title="" style="opacity: 1; cursor: pointer;">💾 Salvează HTML complet</button>
    <span id="expMsg" style="font-size:11px; color:#555; margin-left:6px;"></span>
</div>

<div class="container scara-a-mode" id="tableCont">
    <table>
        <thead>
            <tr id="headRow" class="scara-a-th">
                <th width="20">Ap</th>
                <th width="20">P.</th>
                <th width="40">Cotă</th>
                <th width="25">MC</th>
                <th width="40">V.Apă</th>
                <th width="40">D.Apă</th>
                <th width="35">Cur.</th>
                <th width="35">Gun.</th>
                <th width="35">Sal.</th>
                <th width="35">Crt.</th>
                <th width="35">Sed.</th>
                <th width="35">Bnk.</th>
                <th width="35">Chi.</th>
                <th width="45" class="res-col">TOT LUNA</th>
                <th width="30">FRul.</th>
                <th width="30">FRep.</th>
                <th width="30">Rest.I</th>
                <th width="30">Pen.</th>
                <th width="30">Res.F</th>
                <th width="30">Res.P</th>
                <th width="45" class="res-col">TOT PLATA</th>
            </tr>
        </thead>
        <tbody id="bodyTable"></tbody>
    </table>
</div>

<script>
    let curS = 'A';
    const pretApaMC = 17.03;
    const divizorCota = 49.997;

    // ---- DEBOUNCE pentru save() ----
    let saveTimer = null;
    function saveDebounced() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 400);
    }

    function markRow(id) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const row = document.getElementById('row_' + id);
        if (row) row.classList.add('active-row');
    }

    function recalc() {
        // FIX: calculeaza persoane separat pentru fiecare scara
        let tP_A = 0, tP_B = 0;
        for (let i = 1; i <= 20; i++) {
            let el = document.getElementById('p_' + i);
            if (el) tP_A += parseFloat(el.value) || 0;
        }
        for (let i = 21; i <= 40; i++) {
            let el = document.getElementById('p_' + i);
            if (el) tP_B += parseFloat(el.value) || 0;
        }
        // Afiseaza total persoane scara activa
        const tP_activ = (curS === 'A') ? tP_A : tP_B;
        document.getElementById('tot_p').innerText = tP_activ;

        const fEl  = parseFloat(document.getElementById('f_el').value)   || 0;
        const fDif = parseFloat(document.getElementById('f_dif').value)  || 0;
        const fSal = parseFloat(document.getElementById('f_sal').value)  || 0;
        const fCrt = parseFloat(document.getElementById('f_crt').value)  || 0;
        const fSed = parseFloat(document.getElementById('f_sed').value)  || 0;
        const fBnk = parseFloat(document.getElementById('f_bank').value) || 0;
        const fChr = parseFloat(document.getElementById('f_chir').value) || 0;
        const vGun = parseFloat(document.getElementById('f_gun').value)  || 0;

        // FIX: fiecare scara are propriul sau divizor persoane si propriul uDif (20 ap/scara)
        const uEl_A  = tP_A > 0 ? fEl / tP_A : 0;
        const uEl_B  = tP_B > 0 ? fEl / tP_B : 0;
        const uDif_A = fDif / 20;
        const uDif_B = fDif / 20;

        const uSal = fSal / divizorCota;
        const uCrt = fCrt / divizorCota;
        const uSed = fSed / divizorCota;
        const uBnk = fBnk / divizorCota;
        const uChr = fChr / divizorCota;

        for (let i = 1; i <= 40; i++) {
            let elP = document.getElementById('p_' + i);
            if (!elP) continue;

            let p   = parseFloat(elP.value) || 0;
            let c   = parseFloat(document.getElementById('c_'  + i).value) || 0;
            let mc  = parseFloat(document.getElementById('mc_' + i).value) || 0;

            // FIX: foloseste uEl si uDif corecte per scara
            const uEl  = (i <= 20) ? uEl_A  : uEl_B;
            const uDif = (i <= 20) ? uDif_A : uDif_B;

            const va  = mc * pretApaMC;
            const vd  = uDif;
            const ve  = p * uEl;
            const vg  = p * vGun;
            const vsl = c * uSal;
            const vcr = c * uCrt;
            const vsd = c * uSed;
            const vbk = c * uBnk;
            const vch = c * uChr;

            document.getElementById('va_'  + i).innerText = va.toFixed(2);
            document.getElementById('vd_'  + i).innerText = vd.toFixed(2);
            document.getElementById('ve_'  + i).innerText = ve.toFixed(2);
            document.getElementById('vg_'  + i).innerText = vg.toFixed(2);
            document.getElementById('vsl_' + i).innerText = vsl.toFixed(2);
            document.getElementById('vcr_' + i).innerText = vcr.toFixed(2);
            document.getElementById('vsd_' + i).innerText = vsd.toFixed(2);
            document.getElementById('vbk_' + i).innerText = vbk.toFixed(2);
            document.getElementById('vch_' + i).innerText = vch.toFixed(2);

            let totL = va + vd + ve + vg + c * (uSal + uCrt + uSed + uBnk + uChr);
            document.getElementById('tl_' + i).innerText = totL.toFixed(2);

            // FIX: fr si frp NU se includ in TOT PLATA
            let ri = parseFloat(document.getElementById('ri_' + i).value) || 0;
            let pn = parseFloat(document.getElementById('pn_' + i).value) || 0;
            let rf = parseFloat(document.getElementById('rf_' + i).value) || 0;
            let rp = parseFloat(document.getElementById('rp_' + i).value) || 0;

            document.getElementById('tp_' + i).innerText = (totL + ri + pn + rf + rp).toFixed(2);
        }

        saveDebounced();
    }

    function build() {
        let rows = "";
        for (let i = 1; i <= 40; i++) {
            let vis = (i <= 20) ? '' : 'display:none;';
            rows += `<tr id="row_${i}" style="${vis}" onclick="markRow(${i})">
                <td class="col-ap">${i}</td>
                <td><input type="number" id="p_${i}"   value="1"     oninput="recalc()"></td>
                <td><input type="number" id="c_${i}"   value="2.500" step="0.001" oninput="recalc()"></td>
                <td><input type="number" id="mc_${i}"  value="0"     step="0.01"  oninput="recalc()"></td>
                <td id="va_${i}">0</td><td id="vd_${i}">0</td><td id="ve_${i}">0</td><td id="vg_${i}">0</td>
                <td id="vsl_${i}">0</td><td id="vcr_${i}">0</td><td id="vsd_${i}">0</td><td id="vbk_${i}">0</td><td id="vch_${i}">0</td>
                <td id="tl_${i}" class="res-col">0</td>
                <td class="fond-col"><input type="number" id="fr_${i}"  value="" placeholder="-" oninput="saveDebounced()"></td>
                <td class="fond-col"><input type="number" id="frp_${i}" value="" placeholder="-" oninput="saveDebounced()"></td>
                <td><input type="number" id="ri_${i}"  value="0" oninput="recalc()"></td>
                <td><input type="number" id="pn_${i}"  value="0" oninput="recalc()"></td>
                <td><input type="number" id="rf_${i}"  value="0" oninput="recalc()"></td>
                <td><input type="number" id="rp_${i}"  value="0" oninput="recalc()"></td>
                <td id="tp_${i}" class="res-col">0</td>
            </tr>`;
        }
        document.getElementById('bodyTable').innerHTML = rows;
        load(); // FIX: load dupa build, nu pierde datele
    }

    function switchS(s) {
        curS = s;
        document.getElementById('headRow').className   = s === 'A' ? 'scara-a-th' : 'scara-b-th';
        document.getElementById('tableCont').className = s === 'A' ? 'container scara-a-mode' : 'container scara-b-mode';
        document.getElementById('btnA').classList.toggle('active-a', s === 'A');
        document.getElementById('btnB').classList.toggle('active-b', s === 'B');
        for (let i = 1; i <= 40; i++) {
            const row = document.getElementById('row_' + i);
            if (row) row.style.display = ((i <= 20 && s === 'A') || (i > 20 && s === 'B')) ? '' : 'none';
        }
        // FIX: recalculeaza dupa schimbare de scara ca sa actualizeze tot_p
        recalc();
    }

    function save() {
        const d = { in: {} };
        document.querySelectorAll('input').forEach(el => {
            if (el.id) d.in[el.id] = el.value;
        });
        try {
            localStorage.setItem('saturn_full_gest_v2', JSON.stringify(d));
        } catch(e) {
            console.warn('localStorage save failed:', e);
        }
    }

    function load() {
        try {
            const raw = localStorage.getItem('saturn_full_gest_v2');
            if (!raw) { recalc(); return; }
            const s = JSON.parse(raw);
            if (s && s.in) {
                Object.keys(s.in).forEach(id => {
                    const el = document.getElementById(id);
                    // FIX: verifica ca elementul exista inainte de a-i seta valoarea
                    if (el && el.tagName === 'INPUT') el.value = s.in[id];
                });
            }
        } catch(e) {
            console.warn('localStorage load failed:', e);
        }
        recalc();
    }

    const _h = (s) => s.split('').reduce((a,c)=>Math.imul(31,a)+c.charCodeAt(0)|0, 0);
    const _ph = _h('1234');

    function setButoaneDateStat(esteAdmin) {
        ['btn-json-exp','btn-json-imp','btn-html-save'].forEach(function(cls) {
            document.querySelectorAll('.' + cls).forEach(function(btn) {
                btn.disabled = !esteAdmin;
                btn.style.opacity = esteAdmin ? '1' : '0.35';
                btn.style.cursor  = esteAdmin ? 'pointer' : 'not-allowed';
                btn.title = esteAdmin ? '' : 'Necesita mod ADMIN';
            });
        });
        var imp = document.getElementById('importFile');
        if (imp) imp.disabled = !esteAdmin;
    }

    function verificareParola() {
        var input = prompt("PAROLA:");
        if (input !== null && _h(input) === _ph) {
            document.getElementById('mainBody').classList.toggle('readonly-mode');
            var esteAdmin = !document.getElementById('mainBody').classList.contains('readonly-mode');
            document.getElementById('lockBtn').textContent = esteAdmin ? '🔓 ADMIN' : '🔒 BLOCAT';
            setButoaneDateStat(esteAdmin);
        } else if (input !== null) {
            alert('Parola incorecta!');
        }
    }

    // ---- EXPORT JSON ----
    function exportJSON() {
        const d = { in: {}, _meta: { luna: document.getElementById('l_an').value, titlu: document.getElementById('titlu').value, data: new Date().toLocaleString('ro-RO') } };
        document.querySelectorAll('input').forEach(el => { if (el.id) d.in[el.id] = el.value; });
        const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const luna = (document.getElementById('l_an').value || 'date').replace(/\s+/g, '_');
        a.download = 'Saturn34_' + luna + '.json';
        a.click();
        mesajExp('✅ JSON exportat!');
    }

    // ---- IMPORT JSON ----
    function importJSON(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const d = JSON.parse(e.target.result);
                if (!d.in) throw new Error('Format invalid');
                Object.keys(d.in).forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.tagName === 'INPUT') el.value = d.in[id];
                });
                recalc();
                mesajExp('✅ Date importate din: ' + file.name);
            } catch(err) {
                alert('Eroare la import: ' + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    // ---- SALVARE HTML COMPLET (cu date incluse, admin blocat la deschidere) ----
    function salveazaHTML() {
        var vals = {};
        document.querySelectorAll('input').forEach(function(el) { if (el.id) vals[el.id] = el.value; });
        var jsonDate = JSON.stringify(vals);
        var luna = (document.getElementById('l_an').value || 'date').replace(/\s+/g, '_');

        // Bloc injectat: restaureaza datele si porneste cu admin blocat
        var p1 = '<scr', p2 = 'ipt id="date-salvate">', p3 = '<\/sc', p4 = 'ript>';
        var bloc = '\n' + p1 + p2 + '\n(function(){\n' +
            '  var d=' + jsonDate + ';\n' +
            '  document.addEventListener("DOMContentLoaded",function(){\n' +
            '    setTimeout(function(){\n' +
            '      var ls=null;try{ls=localStorage.getItem("saturn_full_gest_v2");}catch(e){}\n' +
            '      if(!ls){Object.keys(d).forEach(function(id){var el=document.getElementById(id);if(el&&el.tagName==="INPUT")el.value=d[id];});if(typeof recalc==="function")recalc();}\n' +
            '      var lb=document.getElementById("lockBtn");\n' +
            '      if(lb){lb.textContent="\uD83D\uDD13 ADMIN";}\n' +
            '      if(typeof setButoaneDateStat==="function")setButoaneDateStat(false);\n' +
            '    },80);\n' +
            '  });\n' +
            '})();\n' + p3 + p4 + '\n';

        fetch(window.location.href)
            .then(function(r){ return r.text(); })
            .then(function(sursa){
                sursa = sursa.replace(/<script id="date-salvate">[\s\S]*?<\/script>\s*/g, '');
                descarcaHTML(sursa.replace('</body>', bloc + '</body>'), luna);
            })
            .catch(function(){
                var clone = document.documentElement.cloneNode(true);
                var bt = clone.querySelector('#bodyTable');
                if (bt) bt.innerHTML = '';
                var vechi = clone.querySelector('#date-salvate');
                if (vechi) vechi.remove();
                var body = clone.querySelector('body');
                if (body) body.insertAdjacentHTML('beforeend', bloc);
                descarcaHTML('<!DOCTYPE html>\n' + clone.outerHTML, luna);
            });
    }

    function descarcaHTML(html, luna) {
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Saturn34_' + luna + '_COMPLET.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        mesajExp('✅ HTML complet salvat! Funcționează pe orice calculator.');
    }

    function mesajExp(txt) {
        const el = document.getElementById('expMsg');
        el.textContent = txt;
        setTimeout(() => { el.textContent = ''; }, 4000);
    }

    document.addEventListener("DOMContentLoaded", function() {
        build();
        setButoaneDateStat(false);
    });
    setInterval(() => {
        document.getElementById('ceas').innerText = new Date().toLocaleTimeString('ro-RO');
    }, 1000);
</script>
