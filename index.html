<!DOCTYPE html>
<html lang="ro">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Saturn 34 - Gestiune Completă</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Roboto&display=swap');

:root {
    --cyan:    #00f5ff;
    --cyan2:   #00bcd4;
    --cyan-dim:#003d45;
    --neon-g:  #39ff14;
    --neon-r:  #ff2d55;
    --neon-y:  #ffe600;
    --bg:      #020d1a;
    --bg2:     #04192e;
    --bg3:     #071f35;
    --panel:   rgba(0,245,255,0.04);
    --border:  rgba(0,245,255,0.18);
    --text:    #c8f0ff;
    --text2:   #7acfdf;
}

@media print {
    @page { size: A4 landscape; margin: 1mm; }
    body { zoom: 60%; -webkit-print-color-adjust: exact !important; background:#fff !important; }
    .no-print, #lockBtn, .calc-master, .nav-tabs, .export-bar { display: none !important; }
    body, td, th, input { color: #000 !important; background: #fff !important; }
}

* { box-sizing: border-box; }

body {
    font-family: 'Roboto', 'Segoe UI', monospace;
    background: var(--bg);
    margin: 0; padding: 5px;
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
}

/* Grid background - STATIC (optimizat) */
body::before {
    content:'';
    position:fixed; inset:0; z-index:-1;
    background-image:
        linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
}

/* ===== HEADER ===== */
.header-panel {
    display: grid;
    grid-template-columns: 300px 1fr 160px;
    gap: 10px;
    background: rgba(0,20,40,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 8px 12px;
    border: 1px solid var(--cyan);
    border-top: 3px solid var(--cyan);
    box-shadow: 0 0 24px rgba(0,245,255,0.25), inset 0 0 40px rgba(0,245,255,0.03);
    margin-bottom: 5px;
    border-radius: 0 0 8px 8px;
    align-items: center;
    position: relative;
}
.header-panel::before {
    content:'';
    position:absolute; top:0; left:10%; right:10%; height:1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.6;
}

.logo-wrap svg { filter: drop-shadow(0 0 8px #ff2d55); }

#ceas {
    font-family: 'Roboto', monospace;
    font-size: 28px; font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan2);
    letter-spacing: 3px;
}
#l_an {
    font-family: 'Roboto', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--neon-r);
    text-shadow: 0 0 8px var(--neon-r);
    border: none; background: transparent;
    width: 150px; letter-spacing: 2px;
}

.edit-titlu {
    font-family: 'Roboto', monospace;
    font-size: 20px; font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan), 0 0 30px var(--cyan2);
    border: none; background: transparent;
    width: 100%; text-align: center;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 14px var(--cyan), 0 0 30px var(--cyan2);
}

#tot_p {
    color: var(--neon-g);
    text-shadow: 0 0 8px var(--neon-g);
    font-size: 21px; font-weight: 900;
}

#lockBtn {
    font-family: 'Roboto', monospace;
    background: linear-gradient(135deg, #1a0010, #3d0020);
    color: var(--neon-r);
    border: 1px solid var(--neon-r);
    box-shadow: 0 0 8px rgba(255,45,85,0.4);
    padding: 4px 8px; border-radius: 3px;
    font-weight: 700; cursor: pointer; font-size: 10px;
    letter-spacing: 1px;
    transition: all 0.2s;
}
#lockBtn:hover { box-shadow: 0 0 16px rgba(255,45,85,0.8); }

/* ===== CALC MASTER ===== */
.calc-master {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 3px;
    background: rgba(0,15,30,0.8);
    backdrop-filter: blur(4px);
    padding: 4px;
    border: 1px solid var(--border);
    box-shadow: 0 0 12px rgba(0,245,255,0.1);
    margin-bottom: 5px; border-radius: 4px;
}
.calc-group label {
    font-size: 13px; font-weight: 900; display: block; text-align: center;
    color: var(--cyan2); text-transform: uppercase; letter-spacing: 1px;
    text-shadow: 0 0 5px var(--cyan2);
}
.calc-group input {
    width: 75px; text-align: center; font-weight: 700;
    border: 1px solid var(--cyan-dim);
    background: rgba(0,245,255,0.06);
    color: var(--neon-y);
    text-shadow: 0 0 6px var(--neon-y);
    font-size: 18px; margin: 0 auto; display: block;
    border-radius: 2px; padding: 2px;
    font-family: 'Roboto', monospace;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.calc-group input:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,245,255,0.5);
}

/* ===== NAV + PROGRAM ===== */
.nav-tabs {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    margin-bottom: 5px;
    background: rgba(0,15,30,0.85);
    backdrop-filter: blur(5px);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 12px;
    box-shadow: 0 0 14px rgba(0,245,255,0.08);
}
.nav-btns { display: flex; gap: 8px; align-items: center; }
.tab-btn {
    font-family: 'Roboto', monospace;
    padding: 5px 22px; cursor: pointer;
    border: 1px solid transparent;
    font-weight: 700; font-size: 12px;
    text-transform: uppercase; border-radius: 3px;
    color: #fff; letter-spacing: 2px;
    transition: box-shadow 0.2s, color 0.2s;
    will-change: box-shadow;
}
.btn-a { background: linear-gradient(135deg,#0a1f0a,#1b5e20); border-color: #2e7d32; }
.btn-a.active-a {
    background: linear-gradient(135deg,#1b5e20,#2e7d32);
    border-color: var(--neon-g);
    box-shadow: 0 0 14px rgba(57,255,20,0.5);
    color: var(--neon-g); text-shadow: 0 0 8px var(--neon-g);
}
.btn-b { background: linear-gradient(135deg,#020c1e,#0d47a1); border-color: #1565c0; }
.btn-b.active-b {
    background: linear-gradient(135deg,#0d47a1,#1565c0);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,245,255,0.5);
    color: var(--cyan); text-shadow: 0 0 8px var(--cyan);
}

/* Program functionare */
.program-grid {
    display: grid;
    grid-template-columns: auto repeat(5, 1fr);
    grid-template-rows: auto auto;
    gap: 2px 8px;
    align-items: center;
}
.prog-label {
    font-family: 'Roboto', monospace;
    font-size:13px; font-weight: 900;
    color: var(--cyan2);
    text-shadow: 0 0 6px var(--cyan2);
    text-transform: uppercase;
    letter-spacing: 1px;
    grid-row: 1 / span 2;
    padding-right: 6px;
    border-right: 1px solid var(--border);
    text-align: center;
    line-height: 1.4;
}
.prog-zi-name {
    font-family: 'Roboto', monospace;
    font-size: 13px; font-weight: 800;
    text-align: center;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.prog-zi-name.luni    { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
.prog-zi-name.marti   { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
.prog-zi-name.mierc   { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
.prog-zi-name.joi     { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
.prog-zi-name.vineri  { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
.prog-ora {
    font-family: 'Roboto', monospace;
    font-size: 15px; font-weight: 800;
    text-align: center; width: 100%;
    border: none;
    background: rgba(0,245,255,0.06);
    border-bottom: 1px solid var(--cyan-dim);
    color: var(--neon-y);
    text-shadow: 0 0 5px rgba(255,230,0,0.5);
    border-radius: 2px;
    padding: 1px 2px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.prog-ora:focus {
    outline: none;
    border-bottom-color: var(--cyan);
    box-shadow: 0 2px 8px rgba(0,245,255,0.3);
    background: rgba(0,245,255,0.1);
}
.readonly-mode .prog-ora { pointer-events: none; }

/* ===== EXPORT BAR ===== */
.export-bar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    background: rgba(0,20,10,0.8);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(57,255,20,0.25);
    box-shadow: 0 0 10px rgba(57,255,20,0.08);
    border-radius: 4px; padding: 4px 8px; margin-bottom: 5px;
}
.export-bar > span {
    font-weight: 700; font-size: 11px;
    color: var(--neon-g); margin-right: 4px;
    text-shadow: 0 0 6px var(--neon-g);
    font-family: 'Roboto', monospace;
}
.btn-exp {
    padding: 4px 10px; border: 1px solid transparent;
    border-radius: 3px; font-weight: 700; font-size: 11px;
    cursor: pointer; color: #fff;
    font-family: 'Roboto', monospace;
    letter-spacing: 1px; transition: all 0.2s;
}
.btn-json-exp  { background: linear-gradient(135deg,#0a1a3a,#1565c0); border-color: var(--cyan2); }
.btn-json-imp  { background: linear-gradient(135deg,#1a0a3a,#6a1b9a); border-color: #9c27b0; }
.btn-html-save { background: linear-gradient(135deg,#2a0a00,#e65100); border-color: #ff6d00; }
.btn-exp:hover:not(:disabled) {
    box-shadow: 0 0 12px currentColor;
    transform: translateY(-1px);
}

/* ===== TABEL CONTAINER ===== */
.container {
    background: rgba(5,45,61,0.9);
    border: 1px solid var(--border);
    box-shadow: 0 0 20px rgba(0,245,255,0.1);
    overflow-x: auto;
    border-radius: 4px;
    position: relative;
}

/* Overlay de tranzitie intre scari */
#tranzitie-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(0,245,255,0.18) 0%, transparent 70%);
    transition: opacity 0.15s ease;
}
#tranzitie-overlay.activ { opacity: 1; }

/* Scanline sweep la tranzitie */
#tranzitie-sweep {
    position: fixed;
    left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--cyan2), var(--cyan), transparent);
    box-shadow: 0 0 18px var(--cyan), 0 0 40px var(--cyan2);
    z-index: 10000;
    top: -4px;
    transition: none;
}
#tranzitie-sweep.sweep {
    animation: sweepDown 0.45s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes sweepDown {
    0%   { top: -4px; opacity: 1; }
    100% { top: 100vh; opacity: 0.3; }
}

/* Flash border pe tabel */
.container.flash-a {
    animation: flashA 0.5s ease-out;
}
.container.flash-b {
    animation: flashB 0.5s ease-out;
}
@keyframes flashA {
    0%   { box-shadow: 0 0 60px rgba(57,255,20,0.8), 0 0 20px rgba(0,245,255,0.1); border-color: var(--neon-g); }
    100% { box-shadow: 0 0 20px rgba(0,245,255,0.1); border-color: var(--border); }
}
@keyframes flashB {
    0%   { box-shadow: 0 0 60px rgba(0,245,255,0.8), 0 0 20px rgba(0,245,255,0.1); border-color: var(--cyan); }
    100% { box-shadow: 0 0 20px rgba(0,245,255,0.1); border-color: var(--border); }
}

table {
    border-collapse: collapse;
    font-size: 15px; width: 1450px;
    table-layout: fixed;
    margin-left: auto; margin-right: auto;
    font-family: 'Roboto', monospace;
    contain: layout style;
}

/* Header tabel */
th {
    border: 1px solid rgba(0,245,255,0.2);
    padding: 5px 0; font-weight: 900;
    color: var(--cyan); line-height: 1;
    overflow: hidden; text-transform: uppercase;
    font-size: 9px; letter-spacing: 1px;
    text-shadow: 0 0 6px var(--cyan);
}
.scara-a-th th {
    background: linear-gradient(180deg, #0a2010, #0d3018);
    border-bottom: 2px solid var(--neon-g);
}
.scara-b-th th {
    background: linear-gradient(180deg, #020c20, #041530);
    border-bottom: 2px solid var(--cyan);
}

/* Celule normale */
td {
    border: 1px solid rgba(0,245,255,0.08);
    text-align: center; padding: 5px 0;
    font-weight: 700; color: var(--text);
}

.col-ap {
    font-weight: 900; border-right: 1px solid var(--border);
    color: var(--cyan2);
    text-shadow: 0 0 5px var(--cyan2);
}

/* Zebra futurista Scara A - verde inchis */
.scara-a-mode tbody tr:nth-child(even):not(.active-row) td {
    background: rgba(0,60,20,0.35) !important;
}
.scara-a-mode tbody tr:nth-child(odd):not(.active-row) td {
    background: rgba(0,30,10,0.2) !important;
}

/* Zebra futurista Scara B - albastru inchis */
.scara-b-mode tbody tr:nth-child(even):not(.active-row) td {
    background: rgba(0,30,80,0.4) !important;
}
.scara-b-mode tbody tr:nth-child(odd):not(.active-row) td {
    background: rgba(0,15,40,0.2) !important;
}

/* Selectie rand - CYAN NEON */
tr.active-row td {
    background: rgba(0,245,255,0.12) !important;
    border-top: 1px solid var(--cyan) !important;
    border-bottom: 1px solid var(--cyan) !important;
    color: var(--cyan) !important;
    text-shadow: 0 0 8px var(--cyan);
    box-shadow: inset 0 0 20px rgba(0,245,255,0.15);
    box-shadow: inset 0 0 22px rgba(0,245,255,0.2);
}

/* Coloane rezultat */
.res-col {
    background: rgba(255,45,85,0.1) !important;
    color: var(--neon-r) !important;
    text-shadow: 0 0 6px var(--neon-r);
    font-weight: 900;
    border-left: 1px solid rgba(255,45,85,0.4) !important;
    border-right: 1px solid rgba(255,45,85,0.4) !important;
}
tr.active-row .res-col {
    background: rgba(0,245,255,0.2) !important;
    color: var(--cyan) !important;
    text-shadow: 0 0 12px var(--cyan);
}

.fond-col {
    background: rgba(0,100,150,0.15) !important;
}

/* Inputs in tabel */
input[type="number"] {
    width: 95%; border: none; text-align: center;
    font-weight: 800; padding: 1px; font-size: 13px;
    background: transparent;
    color: var(--neon-y);
    font-family: 'Roboto', monospace;
}
input[type="number"]:focus {
    outline: 1px solid var(--cyan);
    background: rgba(0,245,255,0.05);
    border-radius: 2px;
}

.readonly-mode input { pointer-events: none; }

/* Scrollbar futurista */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan2); box-shadow: 0 0 6px var(--cyan); }

/* expMsg */
#expMsg { font-size: 11px; color: var(--neon-g); margin-left: 6px; text-shadow: 0 0 6px var(--neon-g); }
</style>
</head>
<body id="mainBody" class="">
<div id="tranzitie-overlay" class=""></div>
<div id="tranzitie-sweep" class="sweep" style="background: linear-gradient(90deg, transparent, rgb(57, 255, 20), rgb(0, 245, 255), rgb(57, 255, 20), transparent); box-shadow: rgb(57, 255, 20) 0px 0px 18px, rgb(57, 255, 20) 0px 0px 40px;"></div>

<div class="header-panel">
    <div class="logo-wrap" style="display:flex; align-items:center; gap:18px;">
        <svg style="width:52px;height:52px;fill:#ff2d55;" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
        <div>
            <div id="ceas">23:24:05</div>
            <div style="font-size:13px; color:var(--text2); font-family:'Roboto',monospace; letter-spacing:1px;">
                LUNA:&nbsp;<input type="text" id="l_an" value="MAI 2026" oninput="saveDebounced()">
            </div>
        </div>
    </div>

    <div style="text-align:center;">
        <input type="text" id="titlu" class="edit-titlu" value="GESTIUNE SATURN 34-BL.129" oninput="saveDebounced()">
    </div>

    <div style="text-align:right; line-height:1.6;">
        <div style="font-family:'Roboto',monospace; font-size:13px; color:var(--text2);">
            PERS:&nbsp;<span id="tot_p">26</span>
        </div>
        <button id="lockBtn" onclick="verificareParola()">🔓 ADMIN</button>
    </div>
</div>

<div class="calc-master no-print">
    <div class="calc-group"><label>Pier.Apa</label><input type="number" id="f_dif" value="396.39" oninput="recalc()"></div>
    <div class="calc-group"><label>Lumina</label><input type="number" id="f_el" value="40.82" oninput="recalc()"></div>
    <div class="calc-group"><label>Salarii</label><input type="number" id="f_sal" value="490.56" oninput="recalc()"></div>
    <div class="calc-group"><label>Curatenie</label><input type="number" id="f_crt" value="200.01" oninput="recalc()"></div>
    <div class="calc-group"><label>Chelt.Sediu</label><input type="number" id="f_sed" value="22.04" oninput="recalc()"></div>
    <div class="calc-group"><label>Com.Banca</label><input type="number" id="f_bank" value="15.00" oninput="recalc()"></div>
    <div class="calc-group"><label>Chirie</label><input type="number" id="f_chir" value="10.00" oninput="recalc()"></div>
    <div class="calc-group"><label>Gunoi/P</label><input type="number" id="f_gun" value="30.29" oninput="recalc()"></div>
</div>

<div class="nav-tabs no-print">
    <div class="nav-btns">
        <button id="btnA" class="tab-btn btn-a active-a" onclick="switchS('A')">■ Scara A</button>
        <button id="btnB" class="tab-btn btn-b" onclick="switchS('B')">■ Scara B</button>
    </div>

    <div class="program-grid">
        <div class="prog-label">🕐<br>PROGRAM<br>FUNC.</div>

        <div class="prog-zi-name luni">Luni</div>
        <div class="prog-zi-name marti">Marti</div>
        <div class="prog-zi-name mierc">Mierc.</div>
        <div class="prog-zi-name joi">Joi</div>
        <div class="prog-zi-name vineri">Vineri</div>

        <input class="prog-ora" type="text" id="prog_l" value="15:00-18:00" placeholder="--:--" oninput="saveDebounced()">
        <input class="prog-ora" type="text" id="prog_ma" value="11:00-14:00" placeholder="--:--" oninput="saveDebounced()">
        <input class="prog-ora" type="text" id="prog_mi" value="15:00-18:00" placeholder="--:--" oninput="saveDebounced()">
        <input class="prog-ora" type="text" id="prog_j" value="10:00-13:00" placeholder="--:--" oninput="saveDebounced()">
        <input class="prog-ora" type="text" id="prog_v" value="inchis" placeholder="--:--" oninput="saveDebounced()">
    </div>

    <div style="font-family:'Roboto',monospace; font-size:8px; color:var(--text2); text-align:right; line-height:1.6; opacity:0.6;">
        👤 PERS ACTIVE<br>
        <span style="font-size:14px; color:var(--neon-g); text-shadow:0 0 8px var(--neon-g); font-weight:900;" id="tot_p2">26</span>
    </div>
</div>

<div class="export-bar no-print">
    <span>💾 DATE:</span>
    <button class="btn-exp btn-json-exp" onclick="exportJSON()" title="" style="opacity: 1; cursor: pointer;">📤 Export JSON</button>
    <button class="btn-exp btn-json-imp" onclick="document.getElementById('importFile').click()" title="" style="opacity: 1; cursor: pointer;">📥 Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    <button class="btn-exp btn-html-save" onclick="salveazaHTML()" title="" style="opacity: 1; cursor: pointer;">💾 Salvează HTML</button>
    <span id="expMsg"></span>
</div>

<div class="container scara-a-mode flash-a" id="tableCont">
    <table>
        <thead>
            <tr id="headRow" class="scara-a-th">
                <th width="20">Ap</th><th width="20">Nr.P</th><th width="40">Cota parte</th><th width="30">Index Apa</th>
                <th width="40">V.Apa</th><th width="40">Pierderi</th><th width="35">Lumina</th><th width="35">Gunoi.</th>
                <th width="35">Salarii.</th><th width="35">Crt.</th><th width="35">Sed.</th><th width="35">Bnk.</th><th width="35">Chi.</th>
                <th width="45" class="res-col">TOT LUNA</th>
                <th width="30">FRul.</th><th width="30">FRep.</th>
                <th width="30">Rest.I</th><th width="30">Pen.</th><th width="30">Res.F</th><th width="30">Res.P</th>
                <th width="45" class="res-col">TOT PLATA</th>
            </tr>
        </thead>
        <tbody id="bodyTable"></tbody>
    </table>
</div>

<script>
let curS = 'A';
    const pretApaMC = 17.03;
    const divizorCota = 49.997;

    // ---- DEBOUNCE pentru save() ----
    let saveTimer = null;
    function saveDebounced() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 400);
    }

    // ---- WEB AUDIO - Sunet sci-fi click rand ----
    var _actx = null;
    function getAudioCtx() {
        if (!_actx) {
            try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        return _actx;
    }

        let tP_A = 0, tP_B = 0;
        for (let i = 1; i <= 20; i++) {
            let el = document.getElementById('p_' + i);

        }
        // Afiseaza total persoane scara activa

        document.getElementById('tot_p').innerText = tP_activ;

        const fBnk = parseFloat(document.getElementById('f_bank').value) || 0;
        const fChr = parseFloat(document.getElementById('f_chir').value) || 0;
        const vGun = parseFloat(document.getElementById('f_gun').value)  || 0;

        // FIX: fiecare scara are propriul sau divizor persoane si propriul uDif (20 ap/scara)
        const uEl_A  = tP_A > 0 ? fEl / tP_A : 0;
        const uEl_B  = tP_B > 0 ? fEl / tP_B : 0;
        const uDif_A = fDif / 20;
        const uDif_B = fDif / 20;

        const uSal = fSal / divizorCota;
        const uCrt = fCrt / divizorCota;
        const uSed = fSed / divizorCota;
        const uBnk = fBnk / divizorCota;
        const uChr = fChr / divizorCota;

        for (let i = 1; i <= 40; i++) {

            // FIX: foloseste uEl si uDif corecte per scara
            const uEl  = (i <= 20) ? uEl_A  : uEl_B;
            const uDif = (i <= 20) ? uDif_A : uDif_B;

            const va  = mc * pretApaMC;
            const vd  = uDif;
            const ve  = p * uEl;
            const vg  = p * vGun;
            const vsl = c * uSal;
            const vcr = c * uCrt;
            const vsd = c * uSed;
            const vbk = c * uBnk;
            const vch = c * uChr;

            document.getElementById('va_'  + i).innerText = va.toFixed(2);
            document.getElementById('vd_'  + i).innerText = vd.toFixed(2);
            document.getElementById('ve_'  + i).innerText = ve.toFixed(2);
            document.getElementById('vg_'  + i).innerText = vg.toFixed(2);
            document.getElementById('vsl_' + i).innerText = vsl.toFixed(2);
            document.getElementById('vcr_' + i).innerText = vcr.toFixed(2);
            document.getElementById('vsd_' + i).innerText = vsd.toFixed(2);
            document.getElementById('vbk_' + i).innerText = vbk.toFixed(2);
            document.getElementById('vch_' + i).innerText = vch.toFixed(2);

            let totL = va + vd + ve + vg + c * (uSal + uCrt + uSed + uBnk + uChr);

    // ---- SUNET tranzitie scara ----
    function playSwitchSF(scara) {
        var ctx = getAudioCtx(); if (!ctx) return;
        var t = ctx.currentTime;
        var freqs = scara === 'A'
            ? [330, 440, 660, 880]   // Scara A - urcator verde
            : [880, 660, 440, 330];  // Scara B - coborator albastru

        freqs.forEach(function(f, i) {
            var osc = ctx.createOscillator();
            var g   = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = f;
            var st = t + i * 0.07;
            g.gain.setValueAtTime(0, st);
            g.gain.linearRampToValueAtTime(0.15, st + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, st + 0.12);
            osc.start(st); osc.stop(st + 0.13);
        });

        // Whoosh
        var buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var j = 0; j < data.length; j++) data[j] = (Math.random()*2-1) * (1 - j/data.length);
        var src = ctx.createBufferSource();
        src.buffer = buf;
        var filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = scara === 'A' ? 800 : 400;
        filt.Q.value = 1.5;
        var gw = ctx.createGain();
        gw.gain.setValueAtTime(0.06, t);
        gw.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        src.connect(filt); filt.connect(gw); gw.connect(ctx.destination);
        src.start(t); src.stop(t + 0.3);
    }

            : 'linear-gradient(90deg, transparent, #00f5ff, #00bcd4, #00f5ff, transparent)';

            ? '0 0 18px #39ff14, 0 0 40px #39ff14'
            : '0 0 18px #00f5ff, 0 0 40px #00bcd4';

        // Pornim animatia
        overlay.classList.add('activ');
        sweep.classList.remove('sweep');
        void sweep.offsetWidth; // reflow
        sweep.classList.add('sweep');

        // Schimbam continutul la jumatatea animatiei (220ms)

    // ---- IMPORT JSON ----
    function importJSON(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const d = JSON.parse(e.target.result);
                if (!d.in) throw new Error('Format invalid');
                Object.keys(d.in).forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.tagName === 'INPUT') el.value = d.in[id];
                });
                recalc();
                mesajExp('✅ Date importate din: ' + file.name);
            } catch(err) {
                alert('Eroare la import: ' + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }
